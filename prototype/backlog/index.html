<!doctype html>
<!--
  PROTOTYPE: dialogue "backlog" feature for the VN player. Throwaway; not wired
  to src/. Question: what should reviewing past lines + jumping back feel like?

  Three variants of the same feature on one copied scene, switchable via ?v=a|b|c
  or the floating bar:
    a · Messenger card: centred chat modal (closest to the reference shots)
    b · Timeline rail: right-side drawer on a scene spine
    c · Prompt sheet: bottom sheet, denser logbook rows

  Fixed spec in every variant: "^" cue inside the dialogue box's upper-right
  corner, "Backlog" row in the episode menu, click a chat -> warning modal ->
  jump rewinds progress AND truncates the backlog after that point.

  Run: open this file directly, or `npm run dev` then /prototype/backlog/index.html
-->

.bl-scene:first-child { margin-top: 2px; }
.bl-here { color: var(--mint-ink); }
.bl-current { opacity: .6; }
.bl-current .bl-row { cursor: default; }
.bl-jump { position: absolute; top: 50%; right: 12px; transform: translateY(-50%); padding: 3px 10px; border-radius: 999px; background: var(--mint-ink); color: var(--paper); font-size: .74rem; font-weight: 850; opacity: 0; pointer-events: none; transition: opacity .15s var(--ease); }
.bl-you .bl-jump { right: auto; left: 12px; }
.bl-row:hover .bl-jump, .bl-row:focus-visible .bl-jump { opacity: 1; }

/* Placeholder profile faces: pure CSS, no assets. */
.av { flex: none; position: relative; width: 44px; height: 44px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px #e1e1ed; }
.av-mita { background: var(--paper); }
.av-mita i { position: absolute; background: var(--ink); }
.av-mita .e { top: 38%; width: 13%; height: 17%; border-radius: 40%; }
.av-mita .e.l { left: 28%; }
.av-mita .e.r { left: 59%; }
.av-mita .m { left: 40%; bottom: 22%; width: 20%; height: 10%; border-radius: 0 0 999px 999px; background: transparent; border-bottom: 3px solid var(--ink); }
.av-you { display: grid; place-items: center; background: var(--ink); color: var(--paper); }
.av-you svg { width: 60%; height: 60%; }
.av-story { display: grid; place-items: center; background: #c9c9db; color: var(--muted); font-size: 1.2rem; }

/* Warning modal (variants a & c); variant b uses the drawer bar instead. */
.bl-warn { margin: auto; width: min(400px, calc(100% - 32px)); padding: 22px; border: 0; border-radius: 20px; background: var(--paper); color: var(--ink); font: inherit; }
.bl-warn::backdrop { background: rgb(15 15 29 / .68); }
.bl-warn[open] { animation: menu-enter .2s var(--ease); }
.bl-warn h3 { margin: 0 0 4px; font-size: 1.1rem; font-weight: 900; }
.bl-quote { margin: 14px 0; padding: 8px 12px; border-left: 3px solid var(--mint-ink); border-radius: 0 10px 10px 0; background: #fff; font-weight: 700; font-size: .92rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.bl-warn-copy { margin: 0 0 18px; color: var(--warn-ink); font-size: .9rem; font-weight: 750; }
.bl-warn-actions { display: flex; justify-content: flex-end; gap: 10px; }
.bl-warn-actions button { min-height: 44px; }
.v-c .bl-warn { border-radius: 16px 16px 4px 16px; position: relative; }
.v-c .bl-warn::after { content: ''; position: absolute; right: 4px; bottom: 4px; width: 12px; height: 12px; background: var(--mint-ink); clip-path: polygon(100% 0, 100% 100%, 0 100%); }

/* Variant a · centred messenger card (reference shots). */
.v-a .bl-layer { align-items: center; justify-content: center; padding: 20px; }
.v-a .bl-panel { width: min(560px, 100%); max-height: min(640px, 88dvh); border-radius: 22px; box-shadow: 0 18px 50px rgb(15 15 29 / .45); animation: menu-enter .2s var(--ease); }
.v-a .bl-scene { margin-inline: auto; width: fit-content; padding: 3px 12px; border-radius: 999px; background: var(--wash); }
.v-a .bl-foot { display: none; }
.v-a .bl-quote { display: none; }

/* Variant b · right-side timeline rail. */
.v-b .bl-layer { justify-content: flex-end; }
.v-b .bl-panel { width: min(400px, 94vw); height: 100%; border-left: 1px solid #d9d9e6; box-shadow: -16px 0 40px rgb(15 15 29 / .35); animation: rail-in .22s var(--ease); }
@keyframes rail-in { from { transform: translateX(60px); opacity: 0; } to { transform: none; opacity: 1; } }
.v-b .bl-list { background: linear-gradient(#dcdce8, #dcdce8) 35px 0 / 2px 100% no-repeat; }
.v-b .av { width: 34px; height: 34px; box-shadow: 0 0 0 4px var(--paper); }
.v-b .bl-row { gap: 12px; }
.v-b .bl-bubble { font-size: .9rem; padding: 8px 11px; }
.v-b .bl-scene { text-align: left; margin-left: 2px; padding: 2px 10px; display: inline-block; border-radius: 999px; background: var(--ink); color: var(--paper); letter-spacing: .08em; }
.v-b .bl-note { text-align: left; margin-left: 64px; font-size: .8rem; }
.v-b .bl-foot { display: none; }
.v-b .bl-here-row { box-shadow: inset 3px 0 0 var(--mint-ink); border-radius: 0; }
.bl-confirm { position: sticky; bottom: 0; z-index: 3; padding: 12px 16px 16px; border-top: 2px solid var(--mint-ink); background: #fff; box-shadow: 0 -8px 20px rgb(15 15 29 / .12); }
.bl-confirm blockquote { margin: 0 0 8px; font-size: .88rem; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bl-confirm .bl-warn-copy { margin-bottom: 10px; font-size: .82rem; }
.bl-confirm-actions { display: flex; gap: 10px; }
.bl-confirm-actions button { flex: 1; min-height: 44px; }

/* Variant c · bottom prompt sheet, logbook rows. */
.v-c .bl-layer { align-items: flex-end; justify-content: center; }
.v-c .bl-panel { width: min(820px, 100%); height: min(62dvh, 560px); border-radius: 22px 22px 0 0; box-shadow: 0 -14px 44px rgb(15 15 29 / .4); animation: sheet-in .24s var(--ease); }
@keyframes sheet-in { from { transform: translateY(48px); opacity: 0; } to { transform: none; opacity: 1; } }
.bl-grip { display: none; flex: none; width: 44px; height: 5px; margin: 9px auto 0; border-radius: 3px; background: #c9c9db; }
.v-c .bl-grip { display: block; }
.v-c .bl-head { padding-top: 8px; }
.v-c .bl-row { display: grid; grid-template-columns: 30px 104px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 5px 6px; }
.v-c .bl-meta { display: block; margin: 3px 0 0; width: fit-content; }
.v-c .av { width: 30px; height: 30px; }
.v-c .bl-name { margin: 4px 0 0; text-align: right; font-size: .76rem; }
.v-c .bl-main { display: contents; }
.v-c .bl-bubble { border-radius: 10px; font-size: .9rem; }
.v-c .bl-you .bl-row { direction: ltr; flex-direction: row; }
.v-c .bl-you .bl-bubble { border-radius: 10px; justify-self: end; }
.v-c .bl-note { margin: 10px 0; font-size: .8rem; }
.v-c .bl-current { background: #e5f6f2; opacity: 1; }
.v-c .bl-current .bl-row { box-shadow: inset 3px 0 0 var(--mint-ink); }
.v-c .bl-jump { position: static; transform: none; align-self: center; justify-self: end; }
.v-c .bl-you .bl-jump { left: auto; }
.v-c .bl-row:hover .bl-jump, .v-c .bl-row:focus-visible .bl-jump { opacity: 1; }

/* Floating variant switcher: chrome of the prototype, not the design. */
.proto-bar { position: fixed; left: 50%; bottom: 14px; z-index: 40; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px; background: #16162a; color: var(--paper); box-shadow: 0 8px 24px rgb(15 15 29 / .5); font-size: .82rem; font-weight: 800; }
.proto-bar button { min-height: 34px; min-width: 34px; padding: 0 10px; border-radius: 999px; background: transparent; color: var(--mint-bright); font-weight: 900; font-size: 1rem; }
.proto-bar button:hover { background: #ffffff22; }
.proto-label { min-width: 150px; text-align: center; }
.proto-label b { color: var(--mint-bright); }
</style>
</head>
<body>
<main class="player v-a" id="app"></main>

<script>
'use strict'
const REVEAL_MS = 18

/* Mock episode: three scenes, one raise-hand echo, one checkpoint.
   src = index in SCRIPT; dynamic entries (echo/feedback) carry src: null. */
const SCENES = { 1: 'The lift-off', 2: 'Cloud country', 3: 'The check' }
const SCRIPT = [
  { scene: 1, who: 'story', text: 'Rain taps the classroom window. Outside, puddles gather the grey sky.', emotion: 'idle' },
  { scene: 1, who: 'mita', text: 'Today we follow a single drop of water through its whole journey.', emotion: 'talking' },
  { scene: 1, who: 'mita', text: 'It starts in the ocean. Warmth from the sun lifts tiny drops into the air.', emotion: 'talking' },
  { scene: 1, who: 'you', text: 'How does liquid water turn into a gas?', emotion: 'listening', tag: 'Raised hand' },
  { scene: 1, who: 'mita', text: 'Heat gives water molecules the energy to break free. That is evaporation.', emotion: 'happy' },
  { scene: 2, who: 'story', text: 'The drop climbs higher, into air too thin and cold to hold it.', emotion: 'idle' },
  { scene: 2, who: 'mita', text: 'Up here it condenses, clinging to dust with millions of others.', emotion: 'talking' },
  { scene: 2, who: 'mita', text: 'Together they make the clouds you can see from your window.', emotion: 'talking' },
  { scene: 2, who: 'mita', text: 'When a cloud grows heavy enough, the drop falls back down as rain.', emotion: 'talking' },
  { scene: 3, who: 'story', text: 'A quick check before the drop keeps moving.', emotion: 'idle' },
  { scene: 3, who: 'mita', text: 'Which process turns water vapour back into liquid drops?', emotion: 'thinking', tag: 'Checkpoint',
    options: ['Evaporation', 'Condensation', 'Precipitation'], correct: 'Condensation',
    right: 'Exactly, condensation. Cooling air slows the molecules until they gather into drops again.',
    wrong: 'Not quite. Evaporation lifts drops up and precipitation is them falling. Condensation is vapour turning back to liquid.' },
  { scene: 3, who: 'mita', text: 'And when it lands, the journey starts again: collection, evaporation, all of it.', emotion: 'happy' },
]
const VARIANTS = [
  { id: 'a', name: 'Messenger card' },
  { id: 'b', name: 'Timeline rail' },
  { id: 'c', name: 'Prompt sheet' },
]

const state = {
  log: [],          // entries shown so far (the backlog contents)
  next: 0,          // next SCRIPT index to play
  revealed: false,
  done: false,
  backlog: false,
  warnIdx: null,    // backlog row awaiting jump confirmation
  lastTrigger: null,
  variant: 'a',
}
let typeTimer = null

const app = document.getElementById('app')
const cur = () => state.log[state.log.length - 1]
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

function variant() { return VARIANTS.find(v => v.id === state.variant) }
function setVariant(id) {
  state.variant = id
  app.className = 'player v-' + id
  const url = new URL(location.href); url.searchParams.set('v', id)
  history.replaceState(null, '', url)
  renderSwitcher()
  syncWarnDialog()
}

/* ---------- playback ---------- */
function pushScript(i) { state.log.push({ ...SCRIPT[i], src: i }); state.next = i + 1 }
function advance() {
  if (state.next >= SCRIPT.length) { state.done = true; render(); return }
  pushScript(state.next)
  state.revealed = false
  render()
}
function choose(label) {
  const q = cur()
  if (!q.options) return
  state.log.push({ who: 'you', text: label, scene: q.scene, src: null, tag: 'Answered' })
  state.log.push({ who: 'mita', text: label === q.correct ? q.right : q.wrong, scene: q.scene, src: null, emotion: label === q.correct ? 'happy' : 'confused' })
  state.revealed = false
  render()
}
function jumpTo(i) {
  const e = state.log[i]
  let src = e.src
  for (let k = i; src == null && k >= 0; k--) src = state.log[k].src
  state.log = state.log.slice(0, i + 1)
  state.next = (src ?? -1) + 1
  state.revealed = false
  state.done = false
  state.warnIdx = null
  closeBacklog()
  render()
}

/* ---------- typewriter ---------- */
function startType() {
  clearInterval(typeTimer)
  const textEl = document.getElementById('vn-shown')
  const restEl = document.getElementById('vn-rest')
  const e = cur()
  if (!textEl || !e || state.done) return
  const full = e.text
  const reduced = document.documentElement.dataset.motion === 'reduce' || matchMedia('(prefers-reduced-motion: reduce)').matches
  if (state.revealed || reduced) {
    state.revealed = true
    textEl.textContent = full
    if (restEl) restEl.textContent = ''
    syncSpeaking()
    return
  }
  let n = 0
  textEl.textContent = ''
  if (restEl) restEl.textContent = full
  typeTimer = setInterval(() => {
    n = Math.min(n + 1, full.length)
    textEl.textContent = full.slice(0, n)
    if (restEl) restEl.textContent = full.slice(n)
    if (n >= full.length) { clearInterval(typeTimer); state.revealed = true; syncSpeaking(); renderCue() }
  }, REVEAL_MS)
}
function revealAll() {
  clearInterval(typeTimer)
  state.revealed = true
  const e = cur()
  const textEl = document.getElementById('vn-shown')
  if (textEl && e) textEl.textContent = e.text
  const restEl = document.getElementById('vn-rest')
  if (restEl) restEl.textContent = ''
  syncSpeaking()
  renderCue()
}
function syncSpeaking() {
  const m = document.getElementById('mascot')
  if (!m) return
  const e = cur()
  const speaking = !state.revealed && e && e.who === 'mita'
  if (speaking) m.setAttribute('data-speaking', ''); else m.removeAttribute('data-speaking')
}

/* ---------- render ---------- */
function render() {
  const e = cur()
  const isQ = e && e.options && !state.done
  app.innerHTML = `
  <div class="vn-frame ${isQ ? 'mode-checkpoint' : 'mode-playing'}">
    <header class="player-header">
      <span class="brand">JustMaya</span><span class="proto-chip">Prototype</span>
      <span class="player-title">The Water Cycle, Drop by Drop</span>
      <div class="vn-progress">
        <span>Scene ${e ? e.scene : 3} of 3</span>
        <ol aria-hidden="true">${[1, 2, 3].map(s => `<li class="${e && s < e.scene ? 'done' : e && s === e.scene ? 'current' : ''}"></li>`).join('')}</ol>
      </div>
    </header>
    <section class="vn-scene ${isQ ? 'vn-checkpoint-scene' : ''}" aria-label="Scene">
      <div class="vn-stage">
        <figure class="mascot" id="mascot" data-emotion="${e ? e.emotion : 'idle'}" aria-label="Mita stand-in">
          <div class="mascot-body" aria-hidden="true">
            <div class="mascot-face"><span class="brow"></span><span class="eye left"></span><span class="eye right"></span><span class="mouth"></span></div>
            <span class="mascot-mark"></span>
          </div>
          <figcaption class="mascot-state"><span class="mascot-emotion">${e ? e.emotion : 'idle'}</span><span class="mascot-standin">Stand-in character</span></figcaption>
        </figure>
        ${state.done ? '<div class="vn-prompt"><p class="vn-prompt-label">Episode complete</p><p class="vn-prompt-text">The Water Cycle, Drop by Drop</p></div>' : ''}
      </div>
      ${isQ ? `<div class="vn-choice-overlay"><div class="vn-choices">${e.options.map(o => `<button type="button" class="vn-choice" data-pick="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>` : ''}
    </section>
    <section class="vn-dialogue" aria-label="Dialogue">
      <button type="button" class="vn-backlog-cue" id="cue" aria-label="Open backlog">
        <span class="cue-txt" aria-hidden="true">^</span>
        <svg class="cue-svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg>
      </button>
      <button type="button" class="vn-raise" aria-label="Raise your hand to ask a question" title="Prototype: inert">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v6"/>
          <path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
        </svg>
      </button>
      <button type="button" class="vn-dialogue-target" id="target" aria-label="Reveal or advance dialogue">
        <span class="vn-dialogue-scroll-area">
          <span class="vn-speaker">${e ? (e.who === 'you' ? 'You' : 'Mita') : 'Mita'}</span>
          <span class="vn-text"><span id="vn-shown">${state.done ? 'That is the whole journey. The drop is back where it started.' : ''}</span><span class="vn-reveal-boundary"></span><span class="vn-text-rest" id="vn-rest"></span></span>
        </span>
        <span class="vn-advance-cue" id="cue2" aria-hidden="true"></span>
      </button>
    </section>
    <div class="vn-menu-rail">
      <button type="button" class="vn-menu-trigger" id="menu-open" aria-haspopup="dialog" aria-controls="episode-menu">
        <span class="vn-menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>Menu
      </button>
    </div>
  </div>

  <dialog id="episode-menu" class="vn-menu-dialog" aria-labelledby="episode-menu-title">
    <div class="vn-menu-heading"><h2 id="episode-menu-title">Episode menu</h2><button type="button" class="vn-quiet" id="menu-close">Close</button></div>
    <div class="vn-menu-motion">
      <button type="button" role="switch" aria-checked="${document.documentElement.dataset.motion === 'reduce'}" class="vn-motion" id="motion">
        <span>Reduce motion</span><span class="vn-switch" aria-hidden="true"><span class="vn-switch-thumb"></span></span>
      </button>
    </div>
    <button type="button" class="vn-motion vn-menu-backlog" id="menu-backlog">
      <span>Backlog</span><span class="chev" aria-hidden="true">^</span>
    </button>
    <button type="button" class="vn-button vn-menu-leave" id="menu-leave">Leave episode</button>
  </dialog>

  <div class="bl-layer" id="backlog" hidden>
    <section class="bl-panel" role="dialog" aria-modal="true" aria-label="Backlog">
      <div class="bl-grip" aria-hidden="true"></div>
      <header class="bl-head">
        <div><h2>Backlog</h2><p id="bl-sub"></p></div>
        <button type="button" class="vn-quiet bl-close" id="bl-close">Close</button>
      </header>
      <ol class="bl-list" id="bl-list"></ol>
      <footer class="bl-foot">Pick a message to jump back to it.</footer>
      <div class="bl-confirm" id="bl-confirm" hidden>
        <blockquote id="bl-confirm-quote"></blockquote>
        <p class="bl-warn-copy">Rewinds progress and clears later log entries.</p>
        <div class="bl-confirm-actions">
          <button type="button" class="vn-quiet" id="bl-cancel">Keep reading</button>
          <button type="button" class="vn-button" id="bl-jump">Jump back</button>
        </div>
      </div>
    </section>
  </div>

  <dialog class="bl-warn" id="warn" aria-labelledby="warn-title">
    <h3 id="warn-title">Jump back to this line?</h3>
    <p class="bl-quote" id="warn-quote"></p>
    <p class="bl-warn-copy">Rewinds progress and clears later log entries.</p>
    <div class="bl-warn-actions">
      <button type="button" class="vn-quiet" id="warn-cancel">Stay here</button>
      <button type="button" class="vn-button" id="warn-jump">Jump back</button>
    </div>
  </dialog>

  <div class="proto-bar" role="group" aria-label="Prototype variant switcher">
    <button type="button" id="prev" aria-label="Previous variant">←</button>
    <span class="proto-label" id="proto-label"></span>
    <button type="button" id="next" aria-label="Next variant">→</button>
  </div>`

  bind()
  renderCue()
  startType()
  renderSwitcher()
  if (state.backlog) renderBacklog()
}

function renderCue() {
  const cue = document.getElementById('cue2')
  if (cue) cue.textContent = state.done ? '' : state.revealed ? '◆' : '…'
}

function renderSwitcher() {
  const label = document.getElementById('proto-label')
  const v = variant()
  if (label) label.innerHTML = `<b>${v.id.toUpperCase()}</b> · ${v.name}`
}

/* ---------- backlog ---------- */
function avatar(who) {
  if (who === 'mita') return '<span class="av av-mita" aria-hidden="true"><i class="e l"></i><i class="e r"></i><i class="m"></i></span>'
  if (who === 'you') return '<span class="av av-you" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg></span>'
  return '<span class="av av-story" aria-hidden="true">✦</span>'
}
function rowHtml(e, i) {
  const last = i === state.log.length - 1
  if (e.who === 'story') return `<li class="bl-item bl-note" data-i="${i}">${esc(e.text)}${last ? ' <span class="bl-meta bl-here">Here</span>' : ''}</li>`
  const name = e.who === 'you' ? 'You' : 'Mita'
  return `<li class="bl-item ${e.who === 'you' ? 'bl-you' : ''} ${last ? 'bl-current' : ''}" data-i="${i}">
    <button type="button" class="bl-row" ${last ? 'disabled aria-current="true"' : `aria-label="Jump back to ${name}: ${esc(e.text.slice(0, 60))}"`}>
      ${avatar(e.who)}
      <span class="bl-main">
        <span class="bl-name">${name}${e.tag ? ` <span class="bl-meta">${e.tag}</span>` : ''}${last ? ' <span class="bl-meta bl-here">Here</span>' : ''}</span>
        <span class="bl-bubble">${esc(e.text)}</span>
      </span>
      ${last ? '' : '<span class="bl-jump" aria-hidden="true">Jump ↩</span>'}
    </button>
  </li>`
}
function renderBacklog() {
  const list = document.getElementById('bl-list')
  if (!list) return
  const e = cur()
  document.getElementById('bl-sub').textContent = `Scene ${e.scene} of 3 · ${SCENES[e.scene]}`
  let html = '', seenScene = 0
  state.log.forEach((entry, i) => {
    if (entry.scene !== seenScene) { seenScene = entry.scene; html += `<li class="bl-scene">Scene ${seenScene} · ${SCENES[seenScene]}</li>` }
    html += rowHtml(entry, i)
  })
  list.innerHTML = html
  list.scrollTop = list.scrollHeight
}
function openBacklog(from) {
  state.lastTrigger = from || null
  state.backlog = true
  state.warnIdx = null
  const layer = document.getElementById('backlog')
  layer.hidden = false
  renderBacklog()
  const c = document.getElementById('bl-confirm'); if (c) c.hidden = true
  document.getElementById('bl-close').focus({ preventScroll: true })
}
function closeBacklog() {
  state.backlog = false
  state.warnIdx = null
  const layer = document.getElementById('backlog')
  if (layer) layer.hidden = true
  syncWarnDialog()
  const t = state.lastTrigger
  state.lastTrigger = null
  if (t && document.getElementById(t)) document.getElementById(t).focus({ preventScroll: true })
}
function askJump(i) {
  state.warnIdx = i
  syncWarnDialog()
}
function syncWarnDialog() {
  const dlg = document.getElementById('warn')
  const bar = document.getElementById('bl-confirm')
  if (state.warnIdx == null) {
    if (dlg && dlg.open) dlg.close()
    if (bar) bar.hidden = true
    return
  }
  const e = state.log[state.warnIdx]
  const quote = `"${e.who === 'story' ? e.text : (e.who === 'you' ? 'You: ' : 'Mita: ') + e.text}"`
  if (state.variant === 'b') {
    if (dlg && dlg.open) dlg.close()
    if (bar) { bar.hidden = false; document.getElementById('bl-confirm-quote').textContent = quote; }
  } else {
    if (bar) bar.hidden = true
    if (dlg && !dlg.open) { document.getElementById('warn-quote').textContent = quote; dlg.showModal() }
    else if (dlg) document.getElementById('warn-quote').textContent = quote
  }
}

/* ---------- events ---------- */
function bind() {
  const $ = id => document.getElementById(id)
  $('target').addEventListener('click', () => {
    if (state.done) return
    if (!state.revealed) { revealAll(); return }
    if (cur()?.options) return
    advance()
  })
  document.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => { revealAllSync(); choose(b.dataset.pick) }))
  $('cue').addEventListener('click', ev => { ev.stopPropagation(); openBacklog('cue') })
  $('menu-open').addEventListener('click', () => $('episode-menu').showModal())
  $('menu-close').addEventListener('click', () => $('episode-menu').close())
  $('menu-leave').addEventListener('click', () => $('episode-menu').close())
  $('motion').addEventListener('click', () => {
    const root = document.documentElement
    const reduce = root.dataset.motion === 'reduce'
    if (reduce) delete root.dataset.motion; else root.dataset.motion = 'reduce'
    $('motion').setAttribute('aria-checked', String(!reduce))
  })
  $('menu-backlog').addEventListener('click', () => { $('episode-menu').close(); openBacklog('menu-open') })
  $('bl-close').addEventListener('click', () => closeBacklog())
  $('backlog').addEventListener('click', ev => { if (ev.target === ev.currentTarget) closeBacklog() })
  $('bl-list').addEventListener('click', ev => {
    const row = ev.target.closest('.bl-row')
    if (row && !row.disabled) { askJump(+row.closest('[data-i]').dataset.i); return }
    const note = ev.target.closest('.bl-note')
    if (note && !note.querySelector('.bl-here')) askJump(+note.dataset.i)
  })
  $('bl-cancel').addEventListener('click', () => { state.warnIdx = null; syncWarnDialog() })
  $('bl-jump').addEventListener('click', () => jumpTo(state.warnIdx))
  $('warn-cancel').addEventListener('click', () => { state.warnIdx = null; syncWarnDialog() })
  $('warn-jump').addEventListener('click', () => jumpTo(state.warnIdx))
  $('warn').addEventListener('close', () => { state.warnIdx = null })
  $('warn').addEventListener('click', ev => { if (ev.target === ev.currentTarget) { state.warnIdx = null; ev.currentTarget.close() } })
  $('prev').addEventListener('click', () => setVariant(VARIANTS[(VARIANTS.indexOf(variant()) + VARIANTS.length - 1) % VARIANTS.length].id))
  $('next').addEventListener('click', () => setVariant(VARIANTS[(VARIANTS.indexOf(variant()) + 1) % VARIANTS.length].id))
}
function revealAllSync() { if (!state.revealed) revealAll() }

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') {
    const warn = document.getElementById('warn')
    if (warn?.open) { ev.preventDefault(); state.warnIdx = null; warn.close(); return }
    if (state.backlog) {
      if (state.warnIdx != null) { state.warnIdx = null; syncWarnDialog() }
      else closeBacklog()
      return
    }
  }
  if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return
  if (ev.target.closest('input, textarea, [contenteditable]')) return
  if (state.backlog || document.getElementById('episode-menu')?.open || document.getElementById('warn')?.open) return
  setVariant(VARIANTS[(VARIANTS.indexOf(variant()) + (ev.key === 'ArrowRight' ? 1 : VARIANTS.length - 1)) % VARIANTS.length].id)
})
/* Mascot gaze: copied behaviour, lightweight. */
document.addEventListener('pointermove', ev => {
  const m = document.getElementById('mascot')
  if (!m || state.backlog) return
  const r = m.getBoundingClientRect()
  const clamp = v => Math.max(-1, Math.min(1, v))
  m.style.setProperty('--gx', String(clamp((ev.clientX - (r.left + r.width / 2)) / (innerWidth / 2))))
  m.style.setProperty('--gy', String(clamp((ev.clientY - (r.top + r.height / 2)) / (innerHeight / 2))))
}, { passive: true })

/* ---------- boot ---------- */
state.variant = VARIANTS.some(v => v.id === new URLSearchParams(location.search).get('v')) ? new URLSearchParams(location.search).get('v') : 'a'
for (let k = 0; k < 8; k++) pushScript(k)
state.revealed = false
render()
setVariant(state.variant)
</script>
</body>
</html>
