<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Mita × SEKAI Live2D — player prototype (staged)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./player.bundle.css" />
    <style>
        body { margin: 0; background: #23233a; }
        /* The mascot looms over the dialogue box: canvas
           is ~1.5× stage height, top-anchored, so the head sits just under the
           header while the waist-down runs behind the paper box (dialogue is
           z-index 5, paper is opaque). Same rule at every size because it is
           height-driven: narrow stages crop the canvas sides evenly instead. */
        .vn-stage { overflow: hidden; }
        .vn-stage > .mascot-live2d {
            align-self: stretch;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 0;
            overflow: hidden;
        }
        /* !important: PIXI autoDensity writes inline canvas width/height —
           the 150%/auto must override it to upsize the stage. */
        .mascot-live2d canvas {
            display: block;
            flex: none;
            height: 140% !important;
            width: auto !important;
            transform: translateY(2%);
        }
        .player .vn-dialogue {
            margin-top: -72px;
            position: relative;
            z-index: 5;
        }
        .mascot-live2d[data-error]::after {
            content: attr(data-error);
            color: #ffb3b3;
            font: 12px ui-monospace, monospace;
            white-space: pre-wrap;
        }
    </style>
    <script src="./vendor/live2dcubismcore.min.js"></script>
    <script src="./vendor/live2d.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./player.bundle.js"></script>
</body>
</html>
